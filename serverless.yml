service: event-driven-notification-service

provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'eu-central-1'}
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: 14
  # REST API (not the cheaper HTTP API) specifically so the demo API key
  # is checked at the gateway itself, before a request reaches Lambda -
  # see ADR 0009. This is a public-demo safeguard, not real
  # authentication.
  apiGateway:
    apiKeys:
      - ${self:service}-${sls:stage}-key

functions:
  # Parses, normalizes, and enqueues an incoming event; returns 202 as
  # soon as it's on the queue (see src/functions/ingest/handler.ts).
  ingest:
    handler: src/functions/ingest/handler.handler
    environment:
      QUEUE_URL: !Ref NotificationsQueue
    iamRoleStatements:
      - Effect: Allow
        Action: sqs:SendMessage
        Resource: !GetAtt NotificationsQueue.Arn
    events:
      - http:
          path: /events
          method: post
          private: true

  # PUT saves/replaces a user's push token; DELETE deactivates it. One
  # function handles both routes rather than splitting into two Lambdas
  # for a trivial method branch (see src/functions/register-token/handler.ts).
  registerToken:
    handler: src/functions/register-token/handler.handler
    environment:
      TABLE_NAME: !Ref PushTokensTable
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:UpdateItem
        Resource: !GetAtt PushTokensTable.Arn
    events:
      - http:
          path: /users/{id}/push-token
          method: put
          private: true
      - http:
          path: /users/{id}/push-token
          method: delete
          private: true

resources:
  Resources:
    # Catches messages the worker keeps failing to process (see ADR 0001
    # and 0006) so they can be inspected instead of retried forever.
    NotificationsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-notifications-dlq

    # The queue that decouples receiving an event from actually sending
    # the notification (see ADR 0006). VisibilityTimeout is set well
    # above the worker Lambda's own timeout, once that's defined, so a
    # message can't be picked up twice while still being processed.
    NotificationsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-notifications
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NotificationsDLQ.Arn
          maxReceiveCount: 3

    # Stores each user's push token so the worker can look it up by userId
    # (see ADR 0007). On-demand billing means there's no read/write
    # capacity to provision or tune - the table just scales with however
    # much traffic actually shows up.
    PushTokensTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-push-tokens
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
